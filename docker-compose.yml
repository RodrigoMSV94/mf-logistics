services:
  postgres:
    image: postgres:16-alpine
    container_name: mf_logistica_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mflogistica}
      POSTGRES_USER: ${POSTGRES_USER:-mflogistica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en el archivo .env}
    volumes:
      - mf_logistica_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    container_name: mf_logistica_app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mflogistica}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-mflogistica}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en el archivo .env}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-mfadmin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?Configura APP_ADMIN_PASSWORD en el archivo .env}
      APP_ADMIN_FULL_NAME: ${APP_ADMIN_FULL_NAME:-Administradora}
      APP_LOCAL_DATA_RESET_ENABLED: "false"

volumes:
  mf_logistica_postgres:
    name: mf_logistica_postgres
