spring:
  thymeleaf:
    cache: true
  datasource:
    hikari:
      maximum-pool-size: 5

server:
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax
