server:
  port: ${PORT:8080}

spring:
  application:
    name: mf-logistica
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mflogistica}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
  thymeleaf:
    cache: false

app:
  security:
    admin:
      email: ${APP_ADMIN_EMAIL:admin@mflogistica.es}
      password: ${APP_ADMIN_PASSWORD:Admin1234!}
      full-name: ${APP_ADMIN_FULL_NAME:Administrador MF}

