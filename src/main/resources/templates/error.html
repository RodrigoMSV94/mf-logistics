<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error | MF Logistica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
    <style>
        #dashboardLayout { transition: grid-template-columns 200ms ease }
        #dashboardSidebar { min-width: 0; transition: padding 200ms ease, transform 200ms ease, visibility 200ms ease }
        @media (min-width: 1024px) {
            #dashboardLayout.sidebar-collapsed { grid-template-columns: 0 minmax(0, 1fr) }
            #dashboardLayout.sidebar-collapsed #dashboardSidebar {
                visibility: hidden; overflow: hidden; padding-left: 0; padding-right: 0; border: 0
            }
        }
    </style>
</head>
<body class="min-h-screen bg-[#fdf9f4] text-[#242321]">
<div id="dashboardLayout" class="min-h-screen lg:grid lg:grid-cols-[280px_minmax(0,1fr)]">
    <aside id="dashboardSidebar" class="fixed inset-y-0 left-0 z-40 flex w-72 -translate-x-full flex-col border-r border-black/[.04] bg-[#f9f6f2] p-6 lg:sticky lg:top-0 lg:h-screen lg:w-auto lg:translate-x-0 lg:p-8">
        <a href="/dashboard/facturas" class="flex items-center gap-3">
            <img src="/images/mf-logo-transparent.png" alt="MF Logística" class="h-12 w-12 object-contain">
            <b class="text-xl">MF ADMIN</b>
        </a>
        <nav class="mt-14 space-y-3 text-base text-[#555]">
            <a href="/dashboard/facturas" class="flex items-center gap-4 rounded-lg px-4 py-3 font-bold hover:bg-[#f1ede8]">
                <span class="material-symbols-outlined">receipt_long</span>Facturas emitidas
            </a>
        </nav>
        <div class="mt-auto flex items-center gap-3 rounded-xl bg-[#f1ede8] p-4 text-sm">
            <span class="material-symbols-outlined grid h-10 w-10 place-items-center rounded-full bg-black text-white">person</span>
            <span><b>Administración</b><br>fiscal@mflogistica.es</span>
        </div>
    </aside>
    <button id="sidebarBackdrop" type="button" aria-label="Cerrar menú" class="fixed inset-0 z-30 hidden bg-black/30 lg:hidden"></button>
    <main>
        <header class="flex h-20 items-center justify-between border-b border-black/[.04] bg-white px-6">
            <button id="sidebarToggle" type="button" aria-controls="dashboardSidebar" aria-expanded="false"
                    aria-label="Mostrar menú" title="Mostrar menú"
                    class="grid h-10 w-10 place-items-center rounded-lg bg-[#f1ede8] focus:outline-none focus:ring-2 focus:ring-black">
                <span id="sidebarToggleIcon" class="material-symbols-outlined" aria-hidden="true">menu</span>
            </button>
            <form method="post" action="/logout">
                <button class="grid h-10 w-10 place-items-center rounded-full bg-black text-white"
                        title="Cerrar sesión" aria-label="Cerrar sesión"><span class="material-symbols-outlined">person</span></button>
            </form>
        </header>
        <div class="flex min-h-[calc(100vh-5rem)] items-center justify-center px-6 py-10">
            <div class="w-full max-w-xl rounded-2xl border border-black/10 bg-white p-8 shadow-sm">
                <p class="text-xs font-semibold tracking-[0.2em] text-[#e44b7c] uppercase">Sistema MF Logistica</p>
                <h1 class="mt-3 text-3xl font-bold text-black" th:text="${errorTitle}">Error</h1>
                <p class="mt-4 text-[#31302d]" th:text="${errorMessage}">Ha ocurrido un error.</p>
                <a href="/dashboard/facturas"
                   class="mt-6 inline-flex items-center rounded-lg bg-black px-4 py-2 text-sm font-semibold text-white">
                    Volver a facturas
                </a>
            </div>
        </div>
    </main>
</div>
<script>
const layout = document.getElementById('dashboardLayout');
const sidebar = document.getElementById('dashboardSidebar');
const toggle = document.getElementById('sidebarToggle');
const toggleIcon = document.getElementById('sidebarToggleIcon');
const backdrop = document.getElementById('sidebarBackdrop');
const desktopLayout = window.matchMedia('(min-width: 1024px)');
function setSidebarExpanded(expanded) {
    if (desktopLayout.matches) {
        layout.classList.toggle('sidebar-collapsed', !expanded);
    } else {
        sidebar.classList.toggle('translate-x-0', expanded);
        backdrop.classList.toggle('hidden', !expanded);
    }
    toggle.setAttribute('aria-expanded', String(expanded));
    toggle.setAttribute('aria-label', expanded ? 'Ocultar menú' : 'Mostrar menú');
    toggle.title = expanded ? 'Ocultar menú' : 'Mostrar menú';
    toggleIcon.textContent = expanded ? 'menu_open' : 'menu';
}
function updateSidebarForViewport() {
    setSidebarExpanded(desktopLayout.matches && localStorage.getItem('mf-dashboard-sidebar-expanded') === 'true');
}
function saveSidebarPreference(expanded) {
    localStorage.setItem('mf-dashboard-sidebar-expanded', String(expanded));
    setSidebarExpanded(expanded);
}
toggle.addEventListener('click', () => saveSidebarPreference(toggle.getAttribute('aria-expanded') !== 'true'));
backdrop.addEventListener('click', () => saveSidebarPreference(false));
document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && !desktopLayout.matches && toggle.getAttribute('aria-expanded') === 'true') {
        saveSidebarPreference(false);
        toggle.focus();
    }
});
sidebar.querySelector('nav').addEventListener('click', () => {
    if (!desktopLayout.matches) saveSidebarPreference(false);
});
desktopLayout.addEventListener('change', updateSidebarForViewport);
updateSidebarForViewport();
</script>
</body>
</html>
