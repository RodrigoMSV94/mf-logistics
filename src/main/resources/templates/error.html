<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error | MF Logistica</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#fdf9f4] min-h-screen flex items-center justify-center px-6">
<div class="max-w-xl w-full rounded-2xl border border-black/10 bg-white p-8 shadow-sm">
    <p class="text-xs font-semibold tracking-[0.2em] text-[#e44b7c] uppercase">Sistema MF Logistica</p>
    <h1 class="mt-3 text-3xl font-bold text-black" th:text="${errorTitle}">Error</h1>
    <p class="mt-4 text-[#31302d]" th:text="${errorMessage}">Ha ocurrido un error.</p>
    <a href="/dashboard" class="mt-6 inline-flex items-center rounded-lg bg-black px-4 py-2 text-sm font-semibold text-white">
        Volver al panel
    </a>
</div>
</body>
</html>
